services:
  postgres:
    image: postgres:16
    container_name: pg-confmgr
    user: "0:0"                         # run wrapper as root to chown certs
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/pg_ident.conf:/etc/postgresql/pg_ident.conf:ro
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./postgres/entrypoint.sh:/entrypoint.sh:ro
      - ./certs:/certs:ro 
    entrypoint: ["/bin/bash","/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL","gosu postgres pg_isready -h /var/run/postgresql"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
    - .env             
    environment:        
      PGHOST: postgres
      PGUSER: confmgr_db
      PGDATABASE: postgres
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/certs/ca.crt
      PGSSLCERT: /run/certs/client.crt
      PGSSLKEY: /run/certs/client.key
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - ./certs/ca.crt:/run/certs/ca.crt:ro
      - ./certs/client.crt:/run/certs/client.crt:ro
      - ./certs/client.key:/run/certs/client.key:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    depends_on:
      backend:
        condition: service_started
    environment:
      VITE_API_BASE: /api
    ports:
      - "5173:443"
    restart: unless-stopped
    volumes:
      - ./certs/frontend/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./certs/frontend/privkey.pem:/etc/nginx/certs/privkey.pem:ro

volumes:
  pgdata: {}
