name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['develop', 'main']

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }

      - run: pip install -r backend/requirements-dev.txt
      - run: |
          ruff check backend
          mypy backend

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: 'frontend/app/package-lock.json' }

      - run: npm ci --prefix frontend/app
      - run: npm run lint --prefix frontend/app

  lint-docs:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Vale
        uses: errata-ai/vale-action@v2
        with:
          files: 'README.md'
          vale_flags: '--config=.vale.ini'

  build-backend:
    runs-on: ubuntu-latest
    needs: [lint-backend]
    env:
      DOCKER_REPO: namlegief/finalproject
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build backend image
        run: |
          docker build -t backend-ci ./backend
          docker tag backend-ci "$DOCKER_REPO:backend-${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker tag backend-ci "$DOCKER_REPO:backend-latest"
          fi
      - name: Push backend image
        run: |
          docker push "$DOCKER_REPO:backend-${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker push "$DOCKER_REPO:backend-latest"
          fi

  build-frontend:
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    env:
      DOCKER_REPO: namlegief/finalproject
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build frontend image
        run: |
          docker build -t frontend-ci ./frontend
          docker tag frontend-ci "$DOCKER_REPO:frontend-${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker tag frontend-ci "$DOCKER_REPO:frontend-latest"
          fi
      - name: Push frontend image
        run: |
          docker push "$DOCKER_REPO:frontend-${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker push "$DOCKER_REPO:frontend-latest"
          fi

  build-postgres:
    runs-on: ubuntu-latest
    needs: [lint-backend]
    env:
      DOCKER_REPO: namlegief/finalproject
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build postgres image
        run: |
          docker build -t postgres-ci ./postgres
          docker tag postgres-ci "$DOCKER_REPO:postgres-${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker tag postgres-ci "$DOCKER_REPO:postgres-latest"
          fi
      - name: Push postgres image
        run: |
          docker push "$DOCKER_REPO:postgres-${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker push "$DOCKER_REPO:postgres-latest"
          fi

  test-backend:
    runs-on: ubuntu-latest
    needs: [lint-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest backend/tests -m "not e2e" --cov=backend --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  test-frontend:
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: 'frontend/app/package-lock.json' }
      - run: npm ci --prefix frontend/app
      - run: npm --prefix frontend/app test -- --watch=false --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/app/coverage

  smoke:
    runs-on: [self-hosted, agent01]
    needs: [build-backend, build-frontend, build-postgres]
    steps:
      - name: Clean runner workspace
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$GITHUB_WORKSPACE" ]; then
            docker run --rm \
              -v "$GITHUB_WORKSPACE":/workspace \
              alpine \
              sh -c 'set -eu; find /workspace -mindepth 1 -maxdepth 1 -exec rm -rf {} +'
          fi

      - name: Fix workspace permissions
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          gid="$(id -g)"
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            alpine \
            sh -c "chown -R ${uid}:${gid} /workspace" || true

      - uses: actions/checkout@v4
      - name: Cleanup any previous stack
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yaml down --volumes || true
      - name: Prepare environment file
        run: cp .env.test .env
      - name: Generate TLS certs
        run: |
          mkdir -p certs
          cp scripts/generate_cert.sh certs/
          chmod +x certs/generate_cert.sh
          cd certs
          ./generate_cert.sh -f
      - name: Build stack
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yaml build
      - name: Start stack
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yaml up -d
      - name: Smoke tests
        run: backend/tests/smoke_e2e.sh
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yaml -f docker-compose.ci.yaml down --volumes
