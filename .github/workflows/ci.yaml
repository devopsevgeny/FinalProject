name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['develop', 'main']

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }

      - run: pip install -r backend/requirements-dev.txt
      - run: |
          ruff check backend
          mypy backend

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: 'frontend/app/package-lock.json' }

      - run: npm ci --prefix frontend/app
      - run: npm run lint --prefix frontend/app

  lint-docs:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Vale
        uses: errata-ai/vale-action@v2
        with:
          files: 'README.md'
          vale_flags: '--config=.vale.ini'

  build-backend:
    runs-on: ubuntu-latest
    needs: [lint-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -t backend-ci ./backend

  build-frontend:
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        run: docker build -t frontend-ci ./frontend

  test-backend:
    runs-on: ubuntu-latest
    needs: [lint-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest backend/tests -m "not e2e" --cov=backend --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  test-frontend:
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: 'frontend/app/package-lock.json' }
      - run: npm ci --prefix frontend/app
      - run: npm test -- --watch=false --coverage --prefix frontend/app
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/app/coverage

  smoke:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: confmgr_db
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U confmgr_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Build stack
        run: docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Smoke tests
        run: backend/tests/smoke_e2e.sh
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
